<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#085041">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AIHM</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--line:#e3e8e6;--txt:#1d2622;--mut:#6b7772;--g:#0F6E56;--g1:#E1F5EE;--g2:#5DCAA5;--r:#A32D2D;--r1:#FCEBEB;--r2:#F09595;--y:#854F0B;--y1:#FAEEDA;--y2:#EF9F27;--b:#185FA5;--b1:#E6F1FB;--b2:#85B7EB;--p:#534AB7;--p1:#EEEDFE;--p2:#AFA9EC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans Bengali","Hind Siliguri","SolaimanLipi",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 60px}
.hdr{background:#085041;color:#E1F5EE;text-align:center;padding:18px 14px 14px}
.hdr .nm{font-size:18px;font-weight:600}.hdr .sub{font-size:13px;color:#9FE1CB}
.pill{display:inline-block;margin-top:8px;font-size:12px;background:#9FE1CB;color:#085041;padding:3px 12px;border-radius:99px}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .t{flex:1}.top .t b{display:block;font-size:15px}.top .t span{font-size:12px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:9px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.s{padding:5px 10px;font-size:13px}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;text-align:center;cursor:pointer}
.tile .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:20px}
.tile b{display:block;font-size:13px;font-weight:600}.tile small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.big{display:flex;align-items:center;gap:14px;border-radius:12px;padding:16px;cursor:pointer;border:1px solid;margin-bottom:10px}
.big .ic{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.big b{font-size:16px}
label.l{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--txt);width:100%}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.sec{font-size:13px;font-weight:600;color:var(--mut);margin:16px 2px 8px}
.ch{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--mut);user-select:none}
.ch.on-g{color:var(--g);border-color:var(--g2);font-weight:600}
.ch.on-r{color:var(--r);border-color:var(--r2);font-weight:600}
.ch.on-y{color:var(--y);border-color:var(--y2);font-weight:600}
.ch.on-b{color:var(--b);border-color:var(--b2);font-weight:600}
.ch.on-p{color:var(--p);border-color:var(--p2);font-weight:600}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .n{flex:1;min-width:0}.li .n b{display:block;font-size:14px;font-weight:500}.li .n small{font-size:12px;color:var(--mut)}
.ban{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.ban.y{background:var(--y1);border:1px solid var(--y2);color:#633806}
.ban.p{background:var(--p1);border:1px solid var(--p2);color:#3C3489}
.ban.r{background:var(--r1);border:1px solid var(--r2);color:#791F1F}
.ban.g{background:var(--g1);border:1px solid var(--g2);color:#085041}
.ban.b{background:var(--b1);border:1px solid var(--b2);color:#0C447C}
.cnt{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;background:var(--bg);margin-top:6px;font-size:14px}
.cnt.red{background:var(--r1);color:var(--r);font-weight:600}
.cnt .bt{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--txt)}
.cnt .v{min-width:26px;text-align:center;font-weight:600}
.mut{color:var(--mut);font-size:12px}
.err{color:var(--r);font-size:13px;min-height:18px;margin-top:6px}
.okm{color:var(--g);font-size:13px;margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:4px;vertical-align:middle}
.tag.y{background:var(--y1);color:#633806}.tag.r{background:var(--r1);color:#791F1F}.tag.g{background:var(--g1);color:#085041}.tag.b{background:var(--b1);color:#0C447C}
.pinbox{max-width:280px;margin:40px auto;text-align:center}
.pinbox input{text-align:center;font-size:22px;letter-spacing:8px}
.msg{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:13px;white-space:pre-line}
.sugg{background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.sugg div{padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between}
.sugg div:first-child{border-top:none}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.datebar b{font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== মূল তথ্য ===================== */
const LS='hifz-purno-v1';
const BN='০১২৩৪৫৬৭৮৯';
const bn=x=>String(x).replace(/\d/g,d=>BN[d]);
const en=x=>String(x==null?'':x).replace(/[০-৯]/g,d=>BN.indexOf(d));
const pad=n=>String(n).padStart(2,'0');
const DAYS=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function key(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pk(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addD(k,n){const d=pk(k);d.setDate(d.getDate()+n);return key(d)}
function dow(k){return pk(k).getDay()}
function dBn(k){const d=pk(k);return DAYS[d.getDay()]+', '+bn(d.getDate())+' '+MON[d.getMonth()]}
function dShort(k){const d=pk(k);return bn(d.getDate())+' '+MON[d.getMonth()]}
function nowT(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h<12?'সকাল':h<16?'দুপুর':h<18?'বিকাল':'রাত';h=h%12||12;return bn(h)+':'+bn(pad(m))+' '+ap}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return key()}

function seed(){
 const A=['রেদওয়ান মাহমুদ','আমিনুল ইসলাম','আব্দুল্লাহ আল মাসউদ','মুনায়েম ইসহাক','ফারহান আহমদ','শরিফ আহমদ','ইয়াসিন চৌধুরী','হেলাল আহমদ'];
 const AJ=['হিফয দ্বিতীয়','হিফয দ্বিতীয়','হিফয দ্বিতীয়','হিফয প্রথম','হিফয প্রথম','হিফয প্রথম','হিফয প্রথম','হিফয প্রথম'];
 const B=['হাফিজুর রহমান হাদী','আব্দুল্লাহ আল মাহমুদ','আশরাফুল ইসলাম','আয়ান আহমদ (শান)','তাওসিফ আল আদহাম','সোহান আহমদ','কাউছার আহমদ','আদনান আহমদ'];
 const BJ=['হিফয দ্বিতীয়','হিফয দ্বিতীয়','হিফয দ্বিতীয়','হিফয প্রথম','হিফয প্রথম','হিফয প্রথম','হিফয দ্বিতীয়','হিফয দ্বিতীয়'];
 const st=[];
 A.forEach((n,i)=>st.push({id:'ক-'+bn(pad(i+1)),name:n,group:'ক',type:'hifz',jamat:AJ[i],weak:false,status:'ok'}));
 B.forEach((n,i)=>st.push({id:'খ-'+bn(pad(i+1)),name:n,group:'খ',type:'hifz',jamat:BJ[i],weak:false,status:'ok'}));
 st.push({id:'ত-০১',name:'সাব্বির হোসেন',group:'both',type:'takmil',jamat:'হিফয তাকমিল',stage:'half',khatm:0,weak:false,status:'ok'});
 return {
  settings:{madrasa:'আলী ইন্টারন্যাশনাল হাফিজিয়া মাদ্রাসা',addr:'কায়েস্থগ্রাম, হেতিমগঞ্জ-৩১০০, গোলাপগঞ্জ, সিলেট',
   rules:{sabakDohWeak:1,sabakParaDoh:2,satLok:4,satDoh:4,amuLok:2,amuDoh:2,tkHalfLok:2,tkHalfDoh:2,tkFullDoh:1,fine:500,appDays:1},
   kitabs:['তালিমুল ইসলাম','তাজবীদ'],phone:'০১৩৪১-৭৮৬৭৯৪',cmtLimit:3,
   grades:[['মুমতাজ',80],['জায়্যিদ জিদ্দান',60],['জায়্যিদ',45],['মকবুল',33],['রাসিব (ফেল)',0]],
   cmt:['আলহামদুলিল্লাহ, এই মাসে আপনার সন্তান একদিনও সবক, সাতসবক বা আমুখতা বাদ দেয়নি। তার এই নিয়মিত মেহনত সত্যিই প্রশংসার যোগ্য। বাড়িতে গেলে তাকে আদর করে একটু বাহবা দেবেন। আল্লাহ তাআলা তাকে কুরআনের একজন খাঁটি হাফেজ হিসেবে কবুল করুন।','আলহামদুলিল্লাহ, এই মাসে তার পড়া ভালো হয়েছে। আরেকটু মনোযোগী হলে ইনশাআল্লাহ সে আরও ভালো করবে। আপনার দোয়া ও উৎসাহ তার জন্য অনেক উপকারী হবে।','এই মাসে তার পড়ায় কিছুটা ঘাটতি দেখা গেছে। বাড়িতে গেলে তাকে স্নেহের সাথে বুঝিয়ে উৎসাহ দেওয়ার অনুরোধ রইল। আমরাও তার প্রতি বিশেষ খেয়াল রাখছি, ইনশাআল্লাহ।']},
  teachers:[{id:'t1',name:'হাফেজ মাহফুজুল ইসলাম',alias:'বিশ্বনাথী হুজুর',group:'ক',night:true,active:true},
            {id:'t2',name:'হাফেজ শাহাদাত হুসাইন চৌধুরী',alias:'দশঘরী হুজুর',group:'খ',night:false,active:true}],
  students:st,
  att:{},les:{},til:{},shab:{},mashq:{},kitab:{},beh:[],away:[],ret:{},nocls:{},target:{},fines:[],sent:{},alerts:[],log:[],
  contact:[],cal:[],spec:[],tleave:[],exams:{},boards:[],given:{},prepq:{},
  routine:[{n:'সাধারণ',days:[{n:'শনি–বুধ',rows:[['সবক','ফজরের ১ ঘণ্টা আগে',''],['সাতসবক','নাস্তার পর','৭:৪৫'],['মশক','৭:৪৫','৮:১৫'],['আমুখতা','১১:১৫','১:১০'],['তিলাওয়াত','২:১৫','৩:৩০'],['কিতাব','৩:৪৫','৪:১৫'],['নতুন সবক শেখা','মাগরিবের পর','৮:১৫'],['সাতসবক ও আমুখতা পড়া','৯:০০','১০:০০']]},{n:'বৃহস্পতিবার',rows:[['সবক','ফজরের ১ ঘণ্টা আগে',''],['সাতসবক','নাস্তার পর','৭:৪৫'],['শবিনার প্রশ্ন','বাদ মাগরিব','']]},{n:'শুক্রবার',rows:[['হাজিরা','ফজর',''],['হাজিরা','জুমার আগে ও পরে',''],['হাজিরা','বাদ মাগরিব','']]}]}],
  year:{from:'2026-11-01',to:'2026-11-30',name:'পরীক্ষামূলক মাস'}
 };
}
let S=seed();

/* ===================== অবস্থা ===================== */
let ses=null; // {role:'teacher'|'sub'|'dir'|'routine', tid, g}
let V={p:'home'}; // view
let D=today(); // যে দিনের পাতা দেখা হচ্ছে
let tmp={};
function go(p,o){V=Object.assign({p},o||{});tmp={};if(p!=='home'&&p!=='pin')window.scrollTo(0,0);render()}
function T(id){return S.teachers.find(t=>t.id===id)}
function gTeacher(g){return S.teachers.find(t=>t.group===g&&t.active)}
function me(){return ses?(ses.role==='dir'?{id:null,name:'পরিচালক'}:T(ses.tid)):null}
function stOf(g){return S.students.filter(s=>(s.group===g||s.group==='both')&&s.status!=='out')}
function SID(id){return S.students.find(s=>s.id===id)}
function isToday(){return D===today()}
function ro(){const h=new Date().getHours(),t=today();if(ses&&ses.role==='dir')return !(D===t||(h<4&&D===addD(t,-1)));return !(D===t&&h>=4)}
function nightLock(){return !(ses&&ses.role==='dir')&&new Date().getHours()<4}
function logA(txt,kind){S.alerts.unshift({date:today(),time:nowT(),txt,kind:kind||'r'});save()}

/* ছুটি ও অসুস্থ থেকে আজকের অবস্থা */
function awayOn(sid,k){
 for(const a of S.away){if(a.sid!==sid)continue;
  if(a.type==='leave'){if(k>=a.from&&(a.closed?k<a.closed:(k<=a.to||k<=today())))return 'L'}
  else if(a.type==='msick')continue;
  else{if(k>=a.from&&(!a.closed||k<a.closed))return a.type==='run'?'R':'S'}}
 return null}
function overdue(a){return a.type==='leave'&&!a.closed&&today()>a.to}

/* ===================== ছবি/চিহ্ন ===================== */
const IC={home:'🏠',att:'🕌',les:'📖',til:'🎙️',shab:'🌙',mashq:'🔊',kitab:'📚',beh:'⭐',sub:'🔄',exam:'🏆',away:'🏥',ret:'🔔',nocls:'⛔',target:'🎯',fine:'💰',news:'💬',rep:'📋',dir:'🏛️',book:'📗',rout:'🗓️'};

/* ===================== শুরুর পাতা ===================== */
function vHome(){
 const t1=gTeacher('ক'),t2=gTeacher('খ');
 return `<div class="hdr"><div style="font-size:30px">🕌</div><div class="nm">${esc(S.settings.madrasa)}</div><div class="sub">হিফয বিভাগ</div><div class="pill">${dBn(today())}</div></div>
 <div class="wrap">
 <div class="tiles" style="grid-template-columns:1fr 1fr;margin-top:4px">
  <div class="tile" style="background:#FAEEDA;border-color:#EF9F27;padding:14px 6px" onclick="go('pin',{to:'dir'})"><div class="ic" style="background:#BA7517;color:#fff">${IC.dir}</div><b style="color:#633806;font-size:15px">কর্তৃপক্ষ</b></div>
  <div class="tile" style="background:#EEEDFE;border-color:#AFA9EC;padding:14px 6px" onclick="go('pin',{to:'routine'})"><div class="ic" style="background:#7F77DD;color:#fff">${IC.rout}</div><b style="color:#3C3489;font-size:15px">রুটিন</b></div>
 </div>
 <div class="tiles" style="grid-template-columns:1fr;margin-top:10px">
  <div class="tile" style="background:#F1EFE8;border-color:#B4B2A9;padding:12px 6px;flex-direction:row;gap:10px;justify-content:center" onclick="go('pin',{to:'office'})"><div class="ic" style="background:#5F5E5A;color:#fff">🗄️</div><b style="color:#444441;font-size:15px">অফিস সহকারী</b></div>
 </div>
 <div class="tiles" style="grid-template-columns:1fr 1fr;margin-top:10px">
  <div class="tile" style="background:#E1F5EE;border-color:#5DCAA5;padding:22px 6px" onclick="go('pin',{to:'g',g:'ক'})"><div class="ic" style="background:#1D9E75;color:#fff">${IC.book}</div><b style="color:#085041;font-size:16px">গ্রুপ ক</b><small>${esc(t1?t1.name:'')}</small></div>
  <div class="tile" style="background:#E6F1FB;border-color:#85B7EB;padding:22px 6px" onclick="go('pin',{to:'g',g:'খ'})"><div class="ic" style="background:#378ADD;color:#fff">${IC.book}</div><b style="color:#0C447C;font-size:16px">গ্রুপ খ</b><small>${esc(t2?t2.name:'')}</small></div>
 </div>
 </div>`}
function vPin(){
 const lab=V.to==='dir'?'কর্তৃপক্ষ':V.to==='routine'?'রুটিন':V.to==='office'?'অফিস সহকারী':V.sub?'বদলি ক্লাস · গ্রুপ '+V.g:'গ্রুপ '+V.g;
 return `<div class="top"><button class="btn s" onclick="go('home')">‹ ফিরুন</button><div class="t"><b>${lab}</b></div></div>
 <div class="pinbox"><div style="font-size:15px;margin-bottom:10px">${V.sub?"পরিচালকের দেওয়া বদলি PIN দিন":"PIN দিন"}</div>

 ${isN?'<div class="ban b">রাতের হাজিরা: দুই গ্রুপের সব শিক্ষার্থী</div>':''}

 if(miss.length){document.getElementById('aerr').textContent='অনুপস্থিত শিক্ষার্থীর কারণ লিখুন';return}

/* ---------- শিক্ষার্থীর পড়া ---------- */
function lastLes(sid,kind,before){
 const ks=Object.keys(S.les).filter(k=>k<before).sort().reverse();
 for(const k of ks){const x=(S.les[k][sid]||{})[kind];if(x&&x.st===2)return x}return null}
function defaults(s,kind){
 if(kind==='kp'){const p=planOf(s.id).kp||{};return{para:p.para||'',page:p.pages?bn(en(p.pages))+' পৃষ্ঠা':'',from:'কাঁচা পারা'}}
 if(kind==='sabak'){const l=lastLes(s.id,'sabak',D);if(l&&l.para){const pg=parseInt(en(l.page))||0;if(pg>=20)return{para:bn((parseInt(en(l.para))||0)+1),page:'১',from:'আগের পারা শেষ, নতুন পারা'};return{para:l.para,page:bn(pg+1),from:'আগের দিন থেকে'}}return{para:'',page:'',from:''}}
 if(kind==='sat'){const sb=((S.les[D]||{})[s.id]||{}).sabak;const src=sb&&sb.para?sb:defaults(s,'sabak');const pg=parseInt(en(src.page))||0;if(src.para&&pg>1)return{para:src.para,page:'১ থেকে '+bn(pg-1),from:'সবকের পারা থেকে'};return{para:src.para||'',page:'',from:src.para?'সবকের পারা থেকে':''}}
 if(kind==='amu'||kind==='tk'){const l=lastLes(s.id,kind,D);if(l&&l.para&&/প্রথম/.test(l.page||''))return{para:l.para,page:'দ্বিতীয় অর্ধেক',from:'গতকাল প্রথম অর্ধেক হয়েছে'};return{para:'',page:'',from:''}}
 return{para:'',page:'',from:''}}
function baseKinds(s){const w=dow(D);if(w===5)return[];const c=calOn(D);if(c&&(OFFT.includes(c.type)||c.type==='exam'))return[];
 let k=s.type==='takmil'?(w===4?[]:['tk']):(w===4?['sabak','sat']:['sabak','sat','amu']);
 if(c&&c.type==='prep'){const all=s.prepAll||(c.board&&!(c.boardList||[]).includes(s.id));if(!all)k=k.filter(x=>x==='amu'||x==='tk')}
 const sp=specOn(D,ses?ses.g:s.group);if(sp)k=k.filter(x=>sp.run.includes(x==='tk'?'আমুখতা':KN[x]));
 return k}
const KN={sabak:'সবক',sat:'সাতসবক',amu:'আমুখতা',tk:'খতমির পড়া',kp:'কাঁচা পারা'};
function limits(s,kind){const R=S.settings.rules;
 if(kind==='kp')return{lok:R.amuLok,doh:R.amuDoh};
 if(kind==='sabak')return{lok:null,doh:s.weak?R.sabakDohWeak:0};
 if(kind==='sat')return{lok:R.satLok,doh:R.satDoh};
 if(kind==='amu')return{lok:R.amuLok,doh:R.amuDoh};
 if(kind==='tk')return s.stage==='full'?{lok:0,doh:s.khatm>=1?0:R.tkFullDoh}:{lok:R.tkHalfLok,doh:R.tkHalfDoh};}
function vLes(){
 const g=ses.g,L=stOf(g);
 if(V.sid)return vLesOne(SID(V.sid));
 const les=S.les[D]||{};
 const rows=L.map(s=>{const aw=offNow(s.id),r=les[s.id]||{},ks=aw?[]:visKinds(s);
  const st=ks.map(k=>{const x=r[k];return x?(x.st===2?(x.ok?'✓':'✗'):x.st===3?'বন্ধ':x.st===4?'—':'…'):'·'});
  const done=ks.length&&ks.every(k=>r[k]&&r[k].st>=2);
  return `<div class="li" style="cursor:pointer" onclick="go('les',{sid:'${s.id}'})"><div class="n"><b>${esc(s.name)}${s.type==='takmil'?'<span class="tag b">তাকমিল</span>':''}${s.weak?'<span class="tag y">দুর্বল</span>':''}</b><small>${s.id}${aw?' · '+awL(aw):''}</small></div><span class="mut">${ks.map((k,i)=>KN[k]+' '+st[i]).join(' · ')||'আজ পড়া নেই'}</span><span style="color:${done?'#0F6E56':'#6b7772'}">${done?'✓':'›'}</span></div>`}).join('');
 return topBar('দৈনিক পাঠ গ্রহণ')+`<div class="wrap">${dateBar()}${dayBanner()}${lesWinBan()}<div class="card">${rows}</div><p class="mut">নাম টিপে পড়া লিখুন · কার কোন পড়া কত দিন বন্ধ, তা ঠিক করুন "পড়া সাজানো" পাতায়</p></div>`}
function vLesOne(s){
 const ks=offNow(s.id)?[]:visKinds(s);S.les[D]=S.les[D]||{};const r=S.les[D][s.id]=S.les[D][s.id]||{};
 const nc=((S.nocls[D]||{})[ses.g]||{items:[]}).items;
 const cards=ks.map(k=>{
  if(lesClosed(s,k))return lesSummary(s,k,r[k]);
  const x=r[k]||{st:0};const lim=limits(s,k);const nm=KN[k];
  if(nc.includes(nm)||(k==='tk'&&nc.includes('আমুখতা')))return `<div class="card"><b>${nm}</b><div class="ban y" style="margin:8px 0 0">আজ ${nm}: ক্লাস হয়নি</div></div>`;
  const offBtn=(k!=='tk'&&!ro())?`<button class="btn s" onclick="lesOff('${s.id}','${k}')">${x.st===3?'খুলুন':nm+' বন্ধ'}</button>`:'';
  const head=`<div class="row" style="align-items:flex-start"><div><b style="font-size:15px">${nm}</b>${k==='tk'?`<div class="mut">${s.stage==='full'?'এক পারা':'আধা পারা'} ধাপ · খতম ${bn(s.khatm||0)}টি</div>`:''}</div><div style="flex:0 0 auto">${x.st!==2?offBtn:''}</div></div>`;
  if(x.st===3)return `<div class="card">${head}<div class="ban y" style="margin:8px 0">আজ ${nm} বন্ধ</div><input placeholder="বন্ধের কারণ লিখুন" value="${esc(x.reason||'')}" oninput="S.les[D]['${s.id}']['${k}'].reason=this.value;save()" ${ro()?'disabled':''}><div class="mut" style="margin-top:6px">পরিচালককে জানানো হয়েছে</div></div>`;
  if(x.st===0){const d=defaults(s,k);return `<div class="card">${head}<div class="mut" style="margin-top:4px">${d.para?bn(d.para)+' পারা'+(d.page?' · '+d.page:''):'পারা এখনো বসানো হয়নি'}</div>${ro()?'<div class="mut">সেদিন হিসাব লেখা হয়নি</div>':`<button class="btn pri w" style="margin-top:8px" onclick="lesStart('${s.id}','${k}')">শুরু করুন</button>`}</div>`}

const AF=['a_name','a_by','a_addr','a_f','a_fm','a_wa','a_mem','a_kacha'];

 <p class="mut" style="text-align:center">ভর্তির পর ৩০ দিনের পর্যবেক্ষণকাল নিজে নিজে শুরু হবে · বাকি তথ্য শিক্ষার্থীর পাতা থেকে যোগ করা যাবে</p></div>`}
function doAdmit(){admKeep();const g=tmp.ag||'ক';const nm=(tmp.a_name||'').trim();if(!nm){document.getElementById('aerr').textContent='শিক্ষার্থীর নাম লিখুন';return}
 const id=nextId(g);const mem=bn(en(tmp.a_mem||'').trim()||'0'),kc=bn(en(tmp.a_kacha||'').trim()||'0');const yad=bn(Math.max(0,(parseInt(en(mem))||0)-(parseInt(en(kc))||0)));
 S.students.push({id,name:nm,group:g,type:g==='both'?'takmil':'hifz',jamat:g==='both'?'হিফয তাকমিল':'হিফয প্রথম',status:'ok',weak:false,

 <div class="sec">উস্তাদের ছুটি ও বদলি</div><div class="card">${(S.tleave||[]).map((l,i)=>`<div class="li"><div class="n"><b>${esc(T(l.tid).name)}</b><small>${dShort(l.from)} থেকে ${dShort(l.to)} · ${esc(l.reason)} · বদলি: ${l.sub?esc(T(l.sub).name):'—'}</small></div><button class="btn s" onclick="S.tleave.splice(${i},1);save();render()">মুছুন</button></div>`).join('')||'<div class="mut">কোনো ছুটি লেখা নেই</div>'}</div>

 <button class="btn s" style="margin-top:10px" onclick="S.routine[${ri}].days[${di}].rows.push(['','','']);save();render()">+ কাজ যোগ করুন</button></div>
 <p class="mut">লিখলেই জমা হয়ে যায় · সময় আপনার নিয়মাবলির রুটিন থেকে বসানো</p></div>`}

 ${x.ab?'':`<div class="row" style="margin-top:6px">${['কুরআন শরীফ (১০০)','তালিমুল ইসলাম (৫০)','তাজবীদ (৫০)'].map((n,j)=>`<div><label class="l">${n}</label><input style="text-align:center" value="${x.m[j]==null?'':bn(x.m[j])}" onchange="texSet('${ex}','${s.id}',${j},this.value)" ${ro()?'disabled':''}></div>`).join('')}</div>`}
 <div class="mut" style="margin-top:6px">${t!==null?'মোট '+bn(t)+' / ২০০':''}${x.by?' · লিখেছেন '+esc(x.by):''}</div></div>`}).join('')}

const OFFT=['holiday','eid','examh'];
const LWIN_DEF={sabak:['04:00','06:00'],sat:['06:00','11:00'],amu:['11:00','14:00']};
let ALLK=false;
function lwin(){return Object.assign({},LWIN_DEF,S.settings.lwin||{})}
function hm(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function tmBn(x){const [h,m]=(x||'00:00').split(':').map(Number);const h12=h%12||12;const p=h<4?'রাত':h<6?'ভোর':h<12?'সকাল':h<15?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত';return p+' '+bn(h12)+(m?':'+bn(pad(m)):'')+'টা'}
function curWin(){if(D!==today())return null;const t=hm(),W=lwin();for(const k of ['sabak','sat','amu']){const w=W[k];if(w&&t>=w[0]&&t<w[1])return k}return null}
function grpName(s){return s.group==='both'?'তাকমিল':'গ্রুপ '+s.group}
function logA(txt,kind){const g=ses&&ses.g?'গ্রুপ '+ses.g+' · ':'';S.alerts.unshift({date:today(),time:nowT(),txt:g+txt,kind:kind||'r'});save()}

/* ---------- কে এখন নেই ---------- */
function absentNow(sid,k){k=k||D;const A=S.att[k]||{};let v=null;
 slotsFor(k).forEach(([sl])=>{const z=A[sl]||{};Object.keys(z).forEach(g=>{const x=z[g];if(x&&x.list&&x.list[sid])v=x.list[sid].v})});return v==='A'}
function offNow(sid){return awayOn(sid,D)||(absentNow(sid,D)?'A':null)}
function awL(c){return {L:'ছুটিতে',S:'অসুস্থ হয়ে বাড়িতে',R:'পালিয়ে গেছে',A:'অনুপস্থিত',M:'মাদ্রাসায় অসুস্থ'}[c]||''}
function attAw(sid){return awayOn(sid,D)||(msickOn(sid,D)?'M':null)}
function msickOn(sid,k){return S.away.find(a=>a.sid===sid&&a.type==='msick'&&k>=a.from&&(!a.closed||k<a.closed))||null}

/* ---------- পড়া সাজানো: বন্ধ ও কাঁচা পারা ---------- */
function planOf(sid){S.plan=S.plan||{};return S.plan[sid]||{}}
function planOff(sid,k,day){const o=(planOf(sid).off||{})[k];return o&&day>=o.from&&day<=o.to?o:null}
function kpOn(sid,day){const p=planOf(sid).kp;return p&&day>=p.from?p:null}
function kindsFor(s){const ks=baseKinds(s);if(!ks.length)return ks;if(kpOn(s.id,D))return['kp'];return ks.filter(k=>!planOff(s.id,k,D))}
function visKinds(s){const ks=kindsFor(s);const w=curWin();if(!w||ALLK)return ks;return ks.filter(k=>k===w||k==='kp'||(k==='tk'&&w==='amu'))}
function lesWinBan(){if(D!==today())return '';const w=curWin(),W=lwin();
 const sw=`<span style="text-decoration:underline;cursor:pointer;white-space:nowrap" onclick="ALLK=!ALLK;render()">${ALLK?'শুধু এখনকার পড়া':'সব পড়া দেখান'}</span>`;
 if(!w)return `<div class="ban b">এখন কোনো পড়ার নির্ধারিত সময় নয় · আজকের হিসাব বন্ধ আকারে দেখা যাচ্ছে · বদলাতে হলে "বদলান" চাপুন</div>`;
 return `<div class="ban g" style="display:flex;justify-content:space-between;gap:8px"><span>এখন <b>${KN[w]}</b>-এর সময় (${tmBn(W[w][0])} – ${tmBn(W[w][1])})${ALLK?'':' · শুধু '+KN[w]+' দেখা যাচ্ছে'}</span>${sw}</div>`}
function winOpen(k){const w=curWin();return w===k||(k==='kp'&&!!w)||(k==='tk'&&w==='amu')}
function lesClosed(s,k){if(D!==today()||ro())return false;if(tmp.op&&tmp.op[s.id+k])return false;return !winOpen(k)}
function lesSummary(s,k,x){const nm=KN[k];const lim=limits(s,k);let st;
 if(!x)st='<span class="mut">এখনো শোনানো হয়নি</span>';
 else if(x.st===3)st=`<b style="color:#854F0B">আজ বন্ধ</b>${x.reason?' · কারণ: '+esc(x.reason):''}`;
 else if(x.st===1)st='<span style="color:#854F0B">শুরু হয়েছে, শেষ হয়নি</span>';
 else st=`${x.para?bn(x.para)+' পারা · ':''}${esc(x.page||'')}<br>${lim.lok!==null?'লোকমা '+bn(x.l||0)+' · ':''}দোহরানো ${bn(x.d||0)} · <b style="color:${x.ok?'#0F6E56':'#A32D2D'}">${x.ok?'পেরেছে':'পারেনি'}</b>${x.t1?` <span class="mut">· ${x.t1}${x.t2?' – '+x.t2:''}</span>`:''}`;
 return `<div class="card" style="background:#fafcfb"><div class="row" style="align-items:center"><div><b style="font-size:15px">${nm}</b><div style="font-size:14px;margin-top:4px">${st}</div></div><button class="btn s" style="flex:0 0 auto" onclick="tmp.op=tmp.op||{};tmp.op['${s.id+k}']=1;render()">${x?'বদলান':'লিখুন'}</button></div></div>`}
function planKinds(s){return (s.type==='takmil'?['tk']:['sabak','sat','amu']).concat(['kp'])}
function daysLeft(to){return Math.round((pk(to)-pk(today()))/864e5)+1}
function vPlan(){
 const L=stOf(ses.g),k0=today(),lock=nightLock();S.plan=S.plan||{};const ed=tmp.ed;
 const rows=L.map(s=>{const kp=kpOn(s.id,k0);
  const btn=k=>{const o=planOff(s.id,k,k0);const nm=KN[k];let st,cl;
   if(k==='kp'){st=kp?bn(en(kp.para))+' পারা চলছে':'নেই';cl=kp?'background:#FAEEDA;color:#633806;border-color:#EF9F27':'background:#fff;color:#55615c'}
   else if(kp){st='কাঁচা পারার জন্য বন্ধ';cl='background:#F1EFE8;color:#888780;border-color:#D3D1C7'}
   else if(o){st='বন্ধ · '+bn(daysLeft(o.to))+' দিন বাকি';cl='background:#FCEBEB;color:#791F1F;border-color:#F09595'}
   else{st='চালু';cl='background:#E1F5EE;color:#085041;border-color:#9FE1CB'}
   const on=ed&&ed.sid===s.id&&ed.k===k;
   return `<div class="pb" style="${cl};${on?'outline:2px solid #378ADD;':''}" onclick="${lock||(kp&&k!=='kp')?'':`planTap('${s.id}','${k}')`}"><b>${nm}</b><span>${st}</span></div>`};
  let edh='';
  if(ed&&ed.sid===s.id){const k=ed.k,o=planOff(s.id,k,k0);
   if(k==='kp')edh=`<div class="pe"><b>কাঁচা পারা</b><div class="mut">চালু থাকলে সবক, সাতসবক ও আমুখতা বন্ধ থাকবে</div><div class="row"><div><label class="l">কোন পারা</label><input inputmode="numeric" value="${esc(tmp.kpp||'')}" oninput="tmp.kpp=this.value"></div><div><label class="l">প্রতিদিন কত পৃষ্ঠা</label><input inputmode="numeric" value="${esc(tmp.kpg||'')}" oninput="tmp.kpg=this.value"></div></div><div class="err" id="perr2"></div>
    <div class="row" style="margin-top:8px"><button class="btn pri" onclick="kpSave('${s.id}')">${kp?'বদলান':'কাঁচা পারা শুরু'}</button>${kp?`<button class="btn" style="color:#085041;border-color:#5DCAA5" onclick="kpEnd('${s.id}')">কাঁচা পারা শেষ</button>`:''}<button class="btn" onclick="tmp={};render()">বাতিল</button></div></div>`;
   else edh=`<div class="pe"><b>${KN[k]} বন্ধ করুন</b><div class="row"><div><label class="l">কত দিন</label><input inputmode="numeric" value="${esc(tmp.pd||'')}" oninput="tmp.pd=this.value"></div></div><label class="l">কারণ (অভিভাবকের বার্তায় যাবে)</label><input value="${esc(tmp.pr||'')}" oninput="tmp.pr=this.value" placeholder="যেমন সবক ইয়াদ নেই"><div class="err" id="perr2"></div>
    <div class="row" style="margin-top:8px"><button class="btn pri" onclick="offSave('${s.id}','${k}')">বন্ধ করুন</button><button class="btn" onclick="tmp={};render()">বাতিল</button></div></div>`}
  const off=offNow(s.id);
  return `<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="mut" style="text-align:right">${s.id}${off?' · '+awL(off):''}</span></div>
  <div class="pgrid">${planKinds(s).map(btn).join('')}</div>${edh}
  ${Object.entries(planOf(s.id).off||{}).filter(([k,o])=>o.to>=k0&&!kp).map(([k,o])=>`<div class="mut" style="margin-top:4px">${KN[k]} বন্ধ ${dShort(o.from)} থেকে ${dShort(o.to)}${o.reason?' · কারণ: '+esc(o.reason):''}</div>`).join('')}
  ${kp?`<div class="mut" style="margin-top:4px">কাঁচা পারা: ${bn(en(kp.para))} পারা · প্রতিদিন ${bn(en(kp.pages||''))} পৃষ্ঠা · ${dShort(kp.from)} থেকে</div>`:''}</div>`}).join('');
 return topBar('পড়া সাজানো')+`<style>.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.pb{border:1px solid;border-radius:10px;padding:7px 3px;text-align:center;cursor:pointer;user-select:none}.pb b{display:block;font-size:13px}.pb span{display:block;font-size:11px;margin-top:2px;line-height:1.3}.pe{margin-top:10px;padding:10px;border:1px dashed #85B7EB;border-radius:10px;background:#F7FAFE}</style><div class="wrap">
 <div class="ban b">সবুজ = চালু · লাল = বন্ধ · হলুদ = কাঁচা পারা · বন্ধ করতে চালু ঘরে টিপুন, আবার চালু করতে লাল ঘরে টিপুন · দিন শেষ হলে নিজে থেকে চালু হবে</div>
 ${lock?'<div class="ban y">রাত ১২টা থেকে ভোর ৪টা পর্যন্ত বদলানো যাবে না</div>':''}${rows}</div>`}
function planTap(sid,k){const o=planOff(sid,k,today());
 if(k!=='kp'&&o){const p=S.plan[sid];delete p.off[k];save();logA(`${(me()||{}).name||''} ${SID(sid).name}-এর ${KN[k]} আবার চালু করেছেন`,'y');tmp={};render();return}
 if(tmp.ed&&tmp.ed.sid===sid&&tmp.ed.k===k){tmp={};render();return}
 tmp={ed:{sid,k}};if(k==='kp'){const p=kpOn(sid,today());if(p){tmp.kpp=p.para;tmp.kpg=p.pages}}render()}

function waNum(s){let d=en(s.wa||s.fatherMob||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('880'))return d;if(d.startsWith('0'))return '88'+d;if(d.length===10)return '880'+d;return d}
function newsMsg(s){const r=(S.les[D]||{})[s.id]||{};const t=me();const nc=((S.nocls[D]||{})[ses.g]||{items:[]}).items;
 const ms=msickOn(s.id,D);const heard=Object.values(r).some(x=>x&&x.st===2);let lines;
 if(ms&&!heard)lines=['আপনার সন্তান আজ অসুস্থ।'+(ms.ill?' অসুখ: '+ms.ill:'')];
 else{const kp=kpOn(s.id,D);const ks=kp?['kp']:baseKinds(s);
  lines=ks.map(k=>{const n=k==='kp'?'কাঁচা পারা ('+bn(en(kp.para))+' পারা)':KN[k];const x=r[k];const o=k==='kp'?null:planOff(s.id,k,D);
   if(o)return '• '+n+': বন্ধ'+(o.reason?' (কারণ: '+o.reason+')':'');
   if(nc.includes(KN[k])||(k==='tk'&&nc.includes('আমুখতা')))return '• '+n+': আজ ক্লাস হয়নি';
   if(!x)return '• '+n+': এখনো শোনানো হয়নি';
   if(x.st===3)return '• '+n+': আজ বন্ধ'+(x.reason?' (কারণ: '+x.reason+')':'');
   if(x.st===2)return '• '+n+': '+(x.ok?'পেরেছে':'পারেনি');
   return '• '+n+': চলছে'});
  if(!lines.length)lines=['• আজ পড়া নেই']}
 return `আসসালামু আলাইকুম।\n${s.name}-এর আজকের পড়া\n${dBn(D)}\n\n${lines.join('\n')}\n\n${t?t.name:''}\n${S.settings.madrasa}`}

 <div style="flex:0 0 auto">${sn[s.id]?`<span class="okm">✓ পাঠানো হয়েছে</span>${ro()?'':` <span style="color:#55615c;text-decoration:underline;cursor:pointer;font-size:12px" onclick="delete S.sent[D]['${s.id}'];save();render()">বাতিল</span>`}`:ro()?'<span class="mut">পাঠানো হয়নি</span>':`<a class="btn s" style="color:#085041;border-color:#5DCAA5;text-decoration:none" href="${waHref(s)}" target="_blank" onclick="S.sent[D]['${s.id}']=nowT();save();setTimeout(render,300)">পাঠান</a>`}</div></div>
 ${open?`<div class="msg">${esc(newsMsg(s))}</div>`:''}</div>`}).join('')}

 <p class="mut">অভিভাবকের WhatsApp নম্বর না থাকলে পিতার মোবাইল নম্বরে যাবে · কোনোটাই না থাকলে WhatsApp-এ নাম বেছে নিতে হবে</p></div>`}

/* ---------- ছুটি ও অসুস্থতা ---------- */
const AWT={msick:'মাদ্রাসায় অসুস্থ',hsick:'অসুস্থ হয়ে বাড়িতে',leave:'ছুটি',run:'পালিয়ে গেছে'};
function vAway(){
 const L=stOf(ses.g);const k=today();const ty=tmp.ty||'';
 const cur=S.away.filter(a=>!a.closed&&L.some(s=>s.id===a.sid));
 const curH=cur.map(a=>{const s=SID(a.sid),od=overdue(a),i=S.away.indexOf(a);
  const det=[a.type==='leave'?dShort(a.from)+' থেকে '+dShort(a.to)+' পর্যন্ত':dShort(a.from)+' থেকে',a.ill?'অসুখ: '+esc(a.ill):'',a.reason?'কারণ: '+esc(a.reason):'',a.note?esc(a.note):'',a.who?'নিয়ে গেছেন: '+esc(a.who)+(a.rel?' ('+esc(a.rel)+')':''):'',a.by?'লিখেছেন: '+esc(a.by):''].filter(Boolean).join(' · ');
  const app=a.type==='leave'&&a.days>S.settings.rules.appDays?`<div class="row" style="margin-top:6px;justify-content:flex-start"><span class="mut" style="flex:0 0 auto">দরখাস্ত:</span><span class="ch ${a.app===1?'on-g':''}" style="flex:0 0 auto" onclick="awApp(${i},1)">জমা হয়েছে</span><span class="ch ${a.app===0?'on-r':''}" style="flex:0 0 auto" onclick="awApp(${i},0)">হয়নি</span></div>`:'';

 const I=(id,lab,ph,type)=>`<div><label class="l">${lab}</label><input ${type?`type="${type}"`:''} value="${esc(tmp[id]||'')}" placeholder="${ph||''}" oninput="tmp['${id}']=this.value" onchange="tmp['${id}']=this.value"></div>`;
 if(ty&&!tmp.af)tmp.af=k;if(ty==='leave'&&!tmp.at)tmp.at=addD(k,1);
 let f='';
 if(ty==='msick')f=`<div class="row">${I('af','কবে থেকে','','date')}${I('ill','কী অসুখ')}</div>`;
 if(ty==='hsick')f=`<div class="row">${I('af','যাওয়ার তারিখ','','date')}${I('ill','কী অসুখ')}</div><div class="row">${I('who','কে নিয়ে গেছেন (নাম)')}${I('rel','সম্পর্ক','যেমন বাবা')}</div>`;
 if(ty==='leave')f=`<div class="row">${I('af','যাওয়ার তারিখ','','date')}${I('at','ফেরার তারিখ','','date')}</div>${I('rs','কারণ')}<div class="row">${I('who','কে নিয়ে গেছেন (নাম)')}${I('rel','সম্পর্ক','যেমন বাবা')}</div>`;
 if(ty==='run')f=`<div class="row">${I('af','কবে','','date')}</div>${I('note','কী জানা গেছে (ঐচ্ছিক)','যেমন রাতের হাজিরায় পাওয়া যায়নি')}`;
 const done=S.away.filter(x=>x.closed===today()&&L.some(s=>s.id===x.sid));
 return topBar('ছুটি ও অসুস্থতা')+`<div class="wrap">${tmp.okm?`<div class="ban g">${esc(tmp.okm)}</div>`:''}
 <div class="sec" style="margin-top:4px">এখন যারা</div>${curH||'<div class="card mut">এখন কেউ ছুটিতে বা অসুস্থ নেই</div>'}

 <div class="sec">নতুন লিখুন</div><div class="card"><label class="l" style="margin-top:0">১. কী হয়েছে</label><div class="chs">${Object.entries(AWT).map(([t,n])=>`<span class="ch ${ty===t?(t==='run'?'on-r':'on-y'):''}" onclick="tmp.ty=tmp.ty==='${t}'?'':'${t}';tmp.okm='';render()">${n}</span>`).join('')}</div>

function saveAway(){const ty=tmp.ty,e=document.getElementById('awerr');const err=t=>{e.textContent=t;e.scrollIntoView({block:'center'})};

 if(ty==='run')a.note=(tmp.note||'').trim();
 if(S.away.some(x=>x.sid===a.sid&&!x.closed))return err('এই শিক্ষার্থী আগে থেকেই "এখন যারা" তালিকায় আছে');

 ${T_('📝','পরীক্ষা প্রস্তুতি প্রশ্নপত্র','পরীক্ষার আগে অনুশীলনের প্রশ্ন',"go('dprepq')",'g')}${T_('🗄️','অফিস সহকারী','রিপোর্ট প্রিন্ট ও স্বাক্ষর ফেরত',"go('office')",'g')}</div>
 <div class="sec">ঠিক করার জায়গা</div><div class="dts">
 ${T_('📇','ভর্তি ও শিক্ষার্থী তথ্য','সবার তথ্য দেখা ও বদলানো',"go('dstu')",'b')}${T_('📅','ক্যালেন্ডার','মাসিক, ঈদ ও পরীক্ষার ছুটি',"go('dcal')",'b')}
 ${T_('⏰','রুটিন','দিনের সময়সূচি ও পড়ার সময়',"go('routine')",'b')}${T_('📢','নোটিশ বোর্ড','উস্তাদদের জন্য বিজ্ঞপ্তি',"go('dspec')",'b')}
 ${T_('⚙️','পাঠ ও ছুটি নীতিমালা','লোকমা-দোহরানোর সীমা, দরখাস্ত ও জরিমানা',"go('drules')",'b')}${T_('🎓','গ্রেড নির্ধারণ ও বোর্ড পরীক্ষা','কত নম্বরে কোন গ্রেড, বোর্ডের ফল',"go('dgrade')",'b')}
 ${T_('🗓️','শিক্ষাবর্ষ','বছরের শুরু ও শেষ',"go('dyear')",'b')}${T_('🔑','পিন ব্যবস্থাপনা','উস্তাদ, অফিস ও অন্যদের পিন',"go('dtch')",'b')}</div>
 <div class="sec">অন্যান্য</div><div class="dts">
 ${T_('🏫','মাদ্রাসার তথ্য','নাম, ঠিকানা, ফোন',"go('dinfo')",'p')}${T_('🕘','প্রবেশের খাতা','কে কখন ঢুকেছেন',"go('dlog')",'p')}${T_('💾','ব্যাকআপ','হিসাবের কপি রাখা',"go('dbak')",'p')}</div></div>`}

/* ---------- পরীক্ষার নম্বর প্রদান ---------- */
const EXS=[['কুরআন শরীফ',100],['তালিমুল ইসলাম',50],['তাজবীদ',50]];
function exLine(ex,sid){const x=S.exams[ex][sid];if(x.ab)return '<span style="color:#A32D2D">অনুপস্থিত</span>';if(x.m.some(v=>v==null))return `${bn(x.m.filter(v=>v!=null).length)} / ৩ বিষয় লেখা হয়েছে`;const t=x.m.reduce((a,b)=>a+b,0);return `মোট <b>${bn(t)}</b> / ২০০ · গড় ${bn(t/2)} · <b style="color:#0F6E56">${grade(t/2)}</b>`}
function vTexam(){
 const ex=V.ex||'e2';const g=V.g2||ses.g;S.exams[ex]=S.exams[ex]||{};const E=S.exams[ex];
 const L=stOf(g);L.forEach(s=>{E[s.id]=E[s.id]||{m:[null,null,null]}});
 const done=L.filter(s=>E[s.id].ab||!E[s.id].m.some(v=>v==null)).length;const pc=L.length?Math.round(done*100/L.length):0;
 return topBar('পরীক্ষার নম্বর প্রদান')+`<div class="wrap"><div class="chs" style="margin-bottom:8px">${Object.entries(EXN).map(([k,n])=>`<span class="ch ${k===ex?'on-g':''}" onclick="go('texam',{ex:'${k}',g2:'${g}'})">${n}</span>`).join('')}</div>
 <div class="chs" style="margin-bottom:10px">${['ক','খ'].map(x=>`<span class="ch ${x===g?'on-b':''}" onclick="go('texam',{ex:'${ex}',g2:'${x}'})">গ্রুপ ${x}</span>`).join('')}</div>
 <div class="card"><div class="row"><span>নম্বর দেওয়া শেষ</span><b style="text-align:right" id="exdone">${bn(done)} / ${bn(L.length)} জন</b></div><div style="height:8px;background:#eef1f0;border-radius:99px;margin-top:8px;overflow:hidden"><div id="exbar" style="height:100%;width:${pc}%;background:#1D9E75"></div></div></div>
 ${L.map((s,i)=>{const x=E[s.id];return `<div class="card"><div class="row"><div><b>${bn(i+1)}. ${esc(s.name)}</b><div class="mut">${s.id} · ${esc(s.jamat)}</div></div><span class="ch ${x.ab?'on-r':''}" style="flex:0 0 auto" onclick="${ro()?'':`texAb('${ex}','${s.id}')`}">অনুপস্থিত</span></div>
 ${x.ab?'':`<div class="row" style="margin-top:6px">${EXS.map(([n,mx],j)=>`<div><label class="l">${n} (${bn(mx)})</label><input inputmode="decimal" style="text-align:center" value="${x.m[j]==null?'':bn(x.m[j])}" onchange="texSet('${ex}','${s.id}',${j},this.value,this)" ${ro()?'disabled':''}></div>`).join('')}</div>`}
 <div class="mut" style="margin-top:6px" id="tt_${s.id}">${exLine(ex,s.id)}</div>${x.by?`<div class="mut">লিখেছেন ${esc(x.by)}</div>`:''}</div>`}).join('')}
 <p class="mut">ঘরে নম্বর লিখে পরের ঘরে গেলেই জমা হয় · গ্রেড সঙ্গে সঙ্গে দেখা যায় · দুই উস্তাদই যেকোনো গ্রুপের নম্বর দিতে পারবেন</p></div>`}
function texSet(ex,sid,j,v,el){let x=parseFloat(en(String(v).trim()));const mx=EXS[j][1];const r=S.exams[ex][sid];
 if(!isNaN(x)&&(x<0||x>mx)){if(el){el.style.borderColor='#E24B4A';el.value='';}const t=document.getElementById('tt_'+sid);if(t)t.innerHTML=`<span style="color:#A32D2D">${EXS[j][0]}-এ ${bn(mx)}-এর বেশি নম্বর হয় না</span>`;r.m[j]=null;save();return}
 if(el)el.style.borderColor='';r.m[j]=isNaN(x)?null:x;r.by=(me()||{}).name;save();
 const t=document.getElementById('tt_'+sid);if(t)t.innerHTML=exLine(ex,sid);
 const g=V.g2||ses.g;const L=stOf(g);const E=S.exams[ex];const done=L.filter(s=>E[s.id]&&(E[s.id].ab||!E[s.id].m.some(v=>v==null))).length;
 const d=document.getElementById('exdone');if(d)d.textContent=bn(done)+' / '+bn(L.length)+' জন';const b=document.getElementById('exbar');if(b)b.style.width=(L.length?Math.round(done*100/L.length):0)+'%'}

function dgCss(){return '<style>.dg{width:100%;border-collapse:collapse;font-size:13px}.dg th{font-weight:400;color:#6b7772;font-size:12px;text-align:center;padding:3px}.dg td{padding:4px 3px;text-align:center;border-top:1px solid #eef1f0}.dg td:first-child{text-align:left}</style>'}
Object.assign(VIEWS,{plan:vPlan,eval:vEval,office:vOffice,oprint:vOprint,news:vNews,away:vAway,dir:vDir,dcal:vDcal,texam:vTexam});

/* ===================== Google Sheet-এর সাথে যোগাযোগ (অ্যাপ) ===================== */
const API='https://script.google.com/macros/s/AKfycbzogn190ol4PYpehM6CL4DeWqaSgqeBR1juqgDI7cQu4y7y3zRRydT2XkEnF09p8pUV/exec';
const DEEP={plan:1,att:3,les:2,til:2,shab:3,mashq:2,kitab:2,ret:2,nocls:2,sent:2,given:2,prepq:2,exams:2,target:2,cmtOv:1,tgWhy:1,tcmt:1,settings:1};
const DESC={log:1,alerts:1,beh:1,contact:1};
const NOPIN={'settings|dirPin':1,'settings|routinePin':1,'settings|subPin':1,'settings|officePin':1};
let SINCE=0,LAST={},READY=false,SENDING=false,AGAIN=false,TMR=null,OC=0,RETRY=null;
let TOKEN=(()=>{try{return localStorage.getItem('aihm-tok')||''}catch(e){return ''}})();
const CK='aihm-cache-v1';
function api(fn,args){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,token:TOKEN})}).then(r=>r.json()).then(j=>{if(j.error){const e=new Error(j.error);e.server=1;throw e}return j.result})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function rec(v,p,d,o){if(NOPIN[p])return;if(d>0&&v&&typeof v==='object'&&!Array.isArray(v)){Object.keys(v).forEach(k=>rec(v[k],p+'|'+k,d-1,o))}else if(v!==undefined)o[p]=JSON.stringify(v)}
const noPin=(k,v)=>k==='pin'?undefined:v;
function flat(){const o={};Object.keys(S).forEach(k=>{const v=S[k];
 if(Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){o[k+'#']='1';const n=v.length;v.forEach((x,i)=>{if(!x._id)x._id=uid();if(x._o==null)x._o=Date.now()*1000+(DESC[k]?(n-i):i)+(OC++%1000)/1000;o[k+'#'+x._id]=k==='teachers'?JSON.stringify(x,noPin):JSON.stringify(x)})}
 else if(DEEP[k]&&v&&typeof v==='object'){o[k+'/']='1';rec(v,k,DEEP[k],o)}
 else o[k]=JSON.stringify(v)});return o}
function build(rows){const base=seed();delete base.settings.dirPin;delete base.settings.routinePin;delete base.settings.subPin;const arr={},obj={},whole={};
 Object.keys(rows).forEach(p=>{const v=rows[p];let m;
  if((m=p.match(/^([^#|\/]+)#(.*)$/))){arr[m[1]]=arr[m[1]]||[];if(m[2])arr[m[1]].push(JSON.parse(v))}
  else if((m=p.match(/^([^#|\/]+)\/$/))){obj[m[1]]=obj[m[1]]||{}}
  else{const ps=p.split('|');const k=ps[0];if(ps.length===1){whole[k]=JSON.parse(v)}else{obj[k]=obj[k]||{};let o=obj[k];for(let i=1;i<ps.length-1;i++){o[ps[i]]=o[ps[i]]||{};o=o[ps[i]]}o[ps[ps.length-1]]=JSON.parse(v)}}});
 Object.keys(whole).forEach(k=>base[k]=whole[k]);
 Object.keys(obj).forEach(k=>{base[k]=k==='settings'?Object.assign(base.settings,obj[k]):obj[k]});
 Object.keys(arr).forEach(k=>{base[k]=arr[k].sort((a,b)=>DESC[k]?b._o-a._o:a._o-b._o)});
 base.teachers.forEach(t=>delete t.pin);
 S=base}
function diff(){const F=flat(),P=[];Object.keys(F).forEach(p=>{if(F[p]!==LAST[p])P.push({p,v:F[p]})});Object.keys(LAST).forEach(p=>{if(!(p in F))P.push({p,v:null})});return P}
function cacheSave(){if(!READY)return;try{const F=flat(),ld={};Object.keys(F).forEach(p=>{if(F[p]!==LAST[p])ld[p]=p in LAST?LAST[p]:null});Object.keys(LAST).forEach(p=>{if(!(p in F))ld[p]=LAST[p]});localStorage.setItem(CK,JSON.stringify({rows:F,ld,since:SINCE}))}catch(e){}}
function syncMsg(t,c){let e=document.getElementById('sync');if(!e){e=document.createElement('div');e.id='sync';e.className='noprint';e.style.cssText='position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;padding:4px 12px;border-radius:99px;z-index:9;pointer-events:none;max-width:92%;text-align:center';document.body.appendChild(e)}
 e.textContent=t;e.style.background=c==='r'?'#FCEBEB':c==='y'?'#FAEEDA':'#E1F5EE';e.style.color=c==='r'?'#791F1F':c==='y'?'#633806':'#085041';e.style.display=t?'block':'none';if(c==='g')setTimeout(()=>{if(e.textContent===t)e.style.display='none'},1500)}
function save(){if(!READY)return;clearTimeout(TMR);TMR=setTimeout(()=>{cacheSave();flush()},500)}
function flush(){if(SENDING){AGAIN=true;return}const P=diff();if(!P.length)return;
 if(!TOKEN){syncMsg('লেখা মোবাইলে রাখা আছে · জমা দিতে নেট থাকা অবস্থায় একবার PIN দিয়ে ঢুকুন','y');return}
 SENDING=true;syncMsg('জমা হচ্ছে…','y');
 api('saveParts',[P]).then(()=>{P.forEach(x=>{if(x.v==null)delete LAST[x.p];else LAST[x.p]=x.v});SENDING=false;cacheSave();syncMsg('জমা হয়েছে','g');if(AGAIN||diff().length){AGAIN=false;flush()}})
 .catch(err=>{SENDING=false;AGAIN=false;
  if(err.server&&/auth/.test(err.message)){TOKEN='';try{localStorage.removeItem('aihm-tok')}catch(e){}syncMsg('লেখা মোবাইলে রাখা আছে · জমা দিতে আবার PIN দিয়ে ঢুকুন','y');return}
  syncMsg('ইন্টারনেট নেই · লেখা মোবাইলে রাখা আছে · নেট এলে নিজে পাঠাবে','y');clearTimeout(RETRY);RETRY=setTimeout(flush,8000)})}
function pull(cb){api('loadSince',[SINCE]).then(r=>{SINCE=r.now;cb(null,r.rows)}).catch(()=>cb(1))}
function applyRemote(ch){const L=flat();let changed=false;Object.keys(ch).forEach(p=>{const v=ch[p];const pending=L[p]!==LAST[p];
 if(v==null){if(!pending&&(p in L)){delete L[p];changed=true}delete LAST[p]}else{if(!pending&&L[p]!==v){L[p]=v;changed=true}LAST[p]=v}});if(changed)build(L);return changed}
function busy(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')}
function refresh(){if(!READY||SENDING)return;pull((err,rows)=>{if(err)return;const ch=applyRemote(rows);cacheSave();if(ch&&!busy())render();if(diff().length)flush()})}

/* ---------- PIN যাচাই (সার্ভারে) ---------- */
async function pinHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('aihm|'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function authCache(){try{return JSON.parse(localStorage.getItem('aihm-auth')||'{}')}catch(e){return{}}}
async function login(kind,g,pin){const h=await pinHash(kind+'|'+g+'|'+pin);const A=authCache();
 try{const r=await api('login',[kind,g,pin]);if(!r){delete A[h];try{localStorage.setItem('aihm-auth',JSON.stringify(A))}catch(e){}return null}
  TOKEN=r.token;try{localStorage.setItem('aihm-tok',TOKEN)}catch(e){}A[h]={role:r.role,tid:r.tid||null};try{localStorage.setItem('aihm-auth',JSON.stringify(A))}catch(e){}if(diff().length)flush();return A[h]}
 catch(e){if(e.server)return null;if(A[h])return Object.assign({offline:1},A[h]);return {nonet:1}}}
function doPin(){const v=en(document.getElementById('pin').value.trim());const e=document.getElementById('perr');if(!v){e.textContent='PIN দিন';return}
 e.textContent='যাচাই হচ্ছে…';const kind=V.to==='dir'?'dir':V.to==='routine'?'routine':V.to==='office'?'office':'g';const g=V.to==='g'||!V.to?(V.g||''):'';
 login(kind,g,v).then(r=>{if(!r){e.textContent='PIN ঠিক হয়নি';return}if(r.nonet){e.textContent='ইন্টারনেট নেই. এই মোবাইলে প্রথমবার ঢুকতে নেট লাগবে.';return}
  if(r.role==='dir'){ses={role:'dir'};S.log.unshift({t:today()+' '+nowT(),w:'পরিচালক'});save();D=today();go('dir')}
  else if(r.role==='routine'){ses={role:'routine'};go('routine')}
  else if(r.role==='office'){ses={role:'office'};S.log.unshift({t:today()+' '+nowT(),w:'অফিস সহকারী'});save();go('office')}
  else{const t=T(r.tid);ses={role:r.role,tid:r.tid,g:V.g};S.log.unshift({t:today()+' '+nowT(),w:(t?t.name:'')+(r.role==='sub'?' · বদলি':'')+' · গ্রুপ '+V.g});save();D=today();go('g')}})}
function setPinUI(which,id,inp){const el=document.getElementById(inp);const v=en(el.value.trim());const m=document.getElementById(inp+'_m');
 if(!/^\d{4}$/.test(v)){m.textContent='৪ অঙ্কের PIN দিন';m.style.color='#A32D2D';return}m.textContent='জমা হচ্ছে…';m.style.color='';
 api('setPin',[which,id,v]).then(()=>{el.value='';m.textContent='নতুন PIN জমা হয়েছে';m.style.color='#0F6E56'}).catch(err=>{m.style.color='#A32D2D';m.textContent=err.server?(/taken/.test(err.message)?'এই PIN অন্য কারো, আরেকটা দিন':'আবার কর্তৃপক্ষের PIN দিয়ে ঢুকে চেষ্টা করুন'):'ইন্টারনেট নেই, নেট থাকলে আবার চেষ্টা করুন'})}
function pinRow(which,id,lab){const k='np_'+which+'_'+(id||'x');return `<div><label class="l">${lab}</label><div class="row"><input id="${k}" type="password" inputmode="numeric" maxlength="4" placeholder="নতুন PIN"><button class="btn s" style="flex:0 0 auto" onclick="setPinUI('${which}','${id||''}','${k}')">বদলান</button></div><div class="mut" id="${k}_m"></div></div>`}

const _go=go;go=function(p,o){_go(p,o);if(['home','g','dir','dtoday','office','news','away'].includes(p))refresh()};
const _render=render;render=function(){if(!READY){document.getElementById('app').innerHTML='<div style="text-align:center;padding:80px 20px;color:#55615c">তথ্য আনা হচ্ছে…</div>';return}_render()};
function boot(){let C=null;try{C=JSON.parse(localStorage.getItem(CK)||'null')}catch(e){}
 if(C&&C.rows){build(C.rows);LAST=Object.assign({},C.rows);Object.keys(C.ld||{}).forEach(p=>{if(C.ld[p]===null)delete LAST[p];else LAST[p]=C.ld[p]});SINCE=C.since||0;READY=true;render();
  pull((err,rows)=>{if(err){syncMsg('ইন্টারনেট নেই · মোবাইলে রাখা হিসাব দেখাচ্ছে','y');setTimeout(refresh,15000);return}const ch=applyRemote(rows);cacheSave();if(ch&&!busy())render();if(diff().length)flush()})}
 else{render();pull((err,rows)=>{if(err){document.getElementById('app').innerHTML='<div style="text-align:center;padding:80px 20px;color:#A32D2D">প্রথমবার খুলতে ইন্টারনেট লাগবে. নেট চালু করে আবার খুলুন.</div>';setTimeout(boot,15000);return}
  build(rows);LAST=Object.assign({},rows);READY=true;cacheSave();render();if(diff().length)flush()})}
 window.addEventListener('online',()=>{flush();refresh()});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')cacheSave();else refresh()});
 window.addEventListener('pagehide',cacheSave);
 setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
